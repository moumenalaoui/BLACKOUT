[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tower-http = { version = "0.5", features = ["fs"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
csv = "1"
dotenvy = "0.15"
sgp4 = "2.4"
# Pulled in transitively by sgp4 (for TLE/OMM epoch handling); declared
# directly here too since a transitive dependency isn't `use`-able on its own,
# and enabled with `serde` so satellite response timestamps derive `Serialize`.
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
insta = { version = "1.39", features = ["json"] }
